<div class="container mt-4">

  <h2 class="text-center">Products List</h2>

  <div class="d-flex justify-content-end mb-3">
    <button
      class="btn btn-primary btn-sm"
      (click)="addProduct()">
      <i class="fas fa-plus"></i>
      Add Product
    </button>

  </div>

  <table
  id="productsTable"
  class="table table-striped table-bordered"
  style="width:100%">

  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Price</th>
      <th>Description</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let product of products">

      <td>{{ product.id }}</td>

      <td>{{ product.name }}</td>

      <td>
        {{ product.price | currency:'INR':'symbol':'1.0-0' }}
      </td>

      <td>{{ product.description }}</td>

      <td>

        <i
          class="fas fa-pen-to-square text-primary me-3 action-icon"
          title="Edit"
          (click)="editProduct(product.id)">
        </i>

        <i
          class="fas fa-trash text-danger action-icon"
          title="Delete"
          data-bs-toggle="modal"
          data-bs-target="#deleteModal"
          (click)="deleteProduct(product.id, product.name)">
        </i>

      </td>

    </tr>
  </tbody>

</table>

</div>

<div
  class="modal fade mt-5"
  id="deleteModal"
  tabindex="-1"
  aria-labelledby="deleteModalLabel"
  aria-hidden="true">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title" id="deleteModalLabel">
          Confirm Delete
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>

      </div>

      <div class="modal-body">

       Are you sure you want to delete the product <strong>"{{ selectedProductName }}"</strong>?

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancel
        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="confirmDelete()">
          Delete
        </button>

      </div>

    </div>

  </div>

</div>
